# Cache policy per resource type (MOSIP-41048: explicit cache control
# to prevent heuristic caching / cache poisoning of UI responses)
map $uri $cache_control {
    # App shell: never cache so new deployments take effect immediately
    ~*/index\.html$                        "no-store, no-cache, must-revalidate";
    # i18n bundles: always revalidate via ETag/Last-Modified
    ~*/assets/i18n/.*\.json$               "no-cache";
    # Versioned build artifacts: cache long, immutable
    ~*\.(js|css|woff2?|ttf|eot|otf)$       "public, max-age=31536000, immutable";
    # Everything else: revalidate before use
    default                                "no-cache";
}

server {
    listen       8080;
    server_name  localhost;
    add_header X-Frame-Options DENY;
    add_header Cache-Control $cache_control;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

   index  index.html index.htm;

  #location ~ ^/templates/.*\.(csv)$ {
    #add_header Content-disposition "attachment; filename=$1";
    #alias /usr/share/nginx/html/templates/;
  #}

   location  /resident-ui {
   alias   /usr/share/nginx/html;
   }
}
