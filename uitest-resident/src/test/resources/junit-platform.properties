cucumber.publish.quiet=true
cucumber.glue=io.mosip.testrig.residentui.steps,io.mosip.testrig.residentui.hooks

# No cucumber.plugin here — Extent reporting comes entirely from the @Before/@BeforeStep/@After
# hooks (ResidentHooks → CucumberHooks), which run synchronously on the scenario's own thread.
# Under this parallel engine, plugin events (TestStepStarted/Finished) are buffered and replayed
# later, sometimes after the page has already closed, so a plugin-based listener isn't used.

# Parallel execution. @login, @updateMyData, @verifyContact and @getMyUin all poll
# NotificationListener for OTPs on the one shared identity's email — it drains messages
# per-email under a single lock, so two of these polling concurrently can have one thread's
# OTP consumed by another's poll loop. Mapping all four to the same exclusive resource
# prevents that. Everything else never calls NotificationListener, so it runs freely.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=5
cucumber.execution.exclusive-resources.login.read-write=SHARED_IDENTITY
cucumber.execution.exclusive-resources.updateMyData.read-write=SHARED_IDENTITY
cucumber.execution.exclusive-resources.verifyContact.read-write=SHARED_IDENTITY
cucumber.execution.exclusive-resources.getMyUin.read-write=SHARED_IDENTITY
