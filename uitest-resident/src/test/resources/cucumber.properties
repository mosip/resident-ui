# Cucumber configuration read by the Cucumber CLI runtime (io.cucumber.core.cli.Main).
#
# IntelliJ's "Cucumber for Java" plugin launches feature-file / scenario right-clicks
# through this CLI runtime, which reads cucumber.properties — but NOT
# junit-platform.properties (that file is only read by the JUnit Platform suite engine
# used by ResidentTestRunner). Without this file, right-click runs would not register
# UiStepListener, so Extent step headers would be missing.
#
# cucumber.plugin and cucumber.glue are ADDITIVE across config sources, so this adds
# our listener alongside IntelliJ's own formatter (the IDE test tree keeps working),
# and does not double-register anything when the suite runs via junit-platform.properties.
cucumber.glue=io.mosip.testrig.residentui.steps,io.mosip.testrig.residentui.hooks
cucumber.plugin=io.mosip.testrig.uitestrig.reporting.UiStepListener
cucumber.publish.quiet=true
